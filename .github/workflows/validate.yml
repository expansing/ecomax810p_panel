name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate card
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check source
        run: npm run check

      - name: Build card
        run: npm run build

      - name: Verify generated artifact
        run: node --check ecomax810p-diagram-card.js

  hacs:
    name: "Validate HACS metadata"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository for HACS
        uses: hacs/action@main
        with:
          category: plugin